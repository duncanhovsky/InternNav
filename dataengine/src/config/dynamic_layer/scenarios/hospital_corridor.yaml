# 医院走廊场景行为方案
# 适用于医院/室内环境：中等密度 NPC、以行走和站立为主

enable_dynamics: true
backend: ira
simulation_length: 400

# 角色：医务人员为主
character_filters:
  - medical
  - female
character_num_min: 5
character_num_max: 12
character_spawn_area:
  - Walkable
character_navigation_area:
  - Walkable

# 行为策略：中等静止比例，部分站立交谈
idle_ratio: 0.35
look_around_ratio: 0.15
max_commands_per_character: 6
# 医院走廊通常较窄
goto_x_range: [-15.0, 15.0]
goto_y_range: [-10.0, 25.0]
goto_z: 0.0
idle_duration_range: [2.0, 6.0]
look_around_duration_range: [1.5, 3.5]

# 传感器
camera_num: 5

# 输出
rgb: true
camera_params: true
bbox_2d_tight: true
bbox_2d_loose: true
bbox_3d: true
skeleton_data: false
semantic_segmentation: false
distance_to_camera: true

headless: true
timeout_s: 700
